<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WellNest | Health Check</title>
    <meta name="description" content="WellNest Health Check — trigger the real AI clinical pipeline on GCP from any device.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ind: #4f46e5; --ind-lt: #6366f1; --purp: #7c3aed;
            --green: #10b981; --amber: #f59e0b; --red: #ef4444;
            --bg: #0c0c1a; --surf: #16162a; --bord: rgba(99,102,241,.2);
            --text: #e2e8f0; --muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
        body::before { content:''; position:fixed; inset:0; background: linear-gradient(rgba(99,102,241,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.05) 1px,transparent 1px); background-size:40px 40px; pointer-events:none; z-index:0; }

        .hdr { position:sticky; top:0; z-index:50; background:rgba(22,22,42,.92); backdrop-filter:blur(14px); border-bottom:1px solid var(--bord); padding:13px 16px; display:flex; align-items:center; justify-content:space-between; }
        .hdr-brand { display:flex; align-items:center; gap:10px; }
        .hdr-icon { width:36px; height:36px; background:linear-gradient(135deg,var(--ind),var(--purp)); border-radius:8px; display:flex; align-items:center; justify-content:center; }
        .hdr-title { font-family:'Outfit',sans-serif; font-size:1.05rem; font-weight:700; }
        .hdr-sub { font-size:0.65rem; color:var(--muted); }
        .conn-pill { display:flex; align-items:center; gap:5px; background:rgba(255,255,255,.07); border:1px solid var(--bord); border-radius:20px; padding:5px 11px; font-size:0.72rem; font-weight:600; }
        .cdot { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.3); }
        .cdot.live { background:#34d399; animation:blink 2s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

        .body { position:relative; z-index:1; flex:1; overflow-y:auto; padding:16px 14px 84px; display:flex; flex-direction:column; gap:14px; }
        .card { background:var(--surf); border:1px solid var(--bord); border-radius:14px; padding:18px; }
        .card-title { font-family:'Outfit',sans-serif; font-size:0.95rem; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
        .card-title span { font-size:1.1rem; }

        .res-list { display:flex; flex-direction:column; gap:7px; }
        .res-row { display:flex; align-items:center; justify-content:space-between; padding:11px 14px; background:rgba(255,255,255,.04); border:2px solid transparent; border-radius:10px; cursor:pointer; transition:all .2s; }
        .res-row:hover { border-color:var(--ind-lt); }
        .res-row.sel { border-color:var(--ind); background:rgba(79,70,229,.18); }
        .res-row-l { display:flex; align-items:center; gap:10px; }
        .rav { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--ind),var(--purp)); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.95rem; flex-shrink:0; }
        .rname { font-weight:600; font-size:0.88rem; }
        .rmeta { font-size:0.7rem; color:var(--muted); }
        .rcheck { color:var(--ind-lt); opacity:0; transition:opacity .2s; }
        .res-row.sel .rcheck { opacity:1; }

        .trigger-wrap { display:flex; flex-direction:column; align-items:center; gap:14px; padding:8px 0; }
        .trigger-btn {
            width:150px; height:150px; border-radius:50%; border:none;
            background:linear-gradient(135deg,var(--ind),var(--purp));
            cursor:pointer; color:white;
            display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
            font-family:'Outfit',sans-serif; font-size:0.9rem; font-weight:700;
            box-shadow:0 0 40px rgba(79,70,229,.45);
            transition:all .3s; touch-action:manipulation;
        }
        .trigger-btn:hover { transform:scale(1.05); box-shadow:0 0 65px rgba(79,70,229,.65); }
        .trigger-btn:active { transform:scale(.96); }
        .trigger-btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }
        .trigger-btn.running { animation:ring 1.4s ease infinite; }
        @keyframes ring {
            0%   { box-shadow:0 0 0 0 rgba(79,70,229,.65),0 0 40px rgba(79,70,229,.45); }
            70%  { box-shadow:0 0 0 28px rgba(79,70,229,0),0 0 40px rgba(79,70,229,.45); }
            100% { box-shadow:0 0 0 0 rgba(79,70,229,0),0 0 40px rgba(79,70,229,.45); }
        }
        .trigger-hint { font-size:0.75rem; color:var(--muted); text-align:center; max-width:240px; line-height:1.6; }

        .prog-bar-wrap { background:rgba(255,255,255,.06); border-radius:6px; height:6px; overflow:hidden; margin-bottom:10px; }
        .prog-bar { height:100%; border-radius:6px; background:linear-gradient(90deg,var(--ind),var(--purp)); width:0%; transition:width .6s ease; }

        .log-box { background:#07070f; border:1px solid rgba(99,102,241,.15); border-radius:10px; padding:12px; height:240px; overflow-y:auto; display:flex; flex-direction:column; gap:3px; font-family:'JetBrains Mono',monospace; font-size:0.7rem; }
        .ll { display:flex; gap:8px; line-height:1.5; word-break:break-word; }
        .lt { color:#374151; flex-shrink:0; }
        .la { flex-shrink:0; font-weight:600; min-width:80px; }
        .lm { color:#9ca3af; }
        .la.ORCHESTRATOR { color:#f59e0b; }
        .la.SENSORY_GUARDIAN { color:#6366f1; }
        .la.MEDICAL_COMPLIANCE { color:#ec4899; }
        .la.COGNITIVE_COMPANION { color:#10b981; }
        .la.CARE_COORDINATOR { color:#8b5cf6; }
        .la.SYSTEM { color:#4b5563; }

        .result-card { border-radius:12px; padding:16px; border:1px solid; animation:rise .4s ease; margin-top:4px; }
        @keyframes rise { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
        .result-card.safe { background:rgba(16,185,129,.1); border-color:rgba(16,185,129,.3); }
        .result-card.warn { background:rgba(245,158,11,.1); border-color:rgba(245,158,11,.3); }
        .result-card.crit { background:rgba(239,68,68,.1); border-color:rgba(239,68,68,.3); }
        .rt { font-family:'Outfit',sans-serif; font-size:1.05rem; font-weight:700; margin-bottom:6px; }
        .rm { font-size:0.83rem; color:var(--muted); line-height:1.6; }
        .acts { display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; }
        .act { font-size:0.68rem; padding:3px 9px; border-radius:10px; background:rgba(255,255,255,.08); color:var(--muted); font-weight:500; }
        .note { font-size:0.7rem; color:var(--muted); text-align:center; margin-top:8px; }

        .bnav { position:fixed; bottom:0; left:0; right:0; background:rgba(22,22,42,.95); backdrop-filter:blur(14px); border-top:1px solid var(--bord); display:flex; z-index:50; padding-bottom:env(safe-area-inset-bottom); }
        .ni { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 6px 12px; gap:4px; font-size:0.62rem; font-weight:600; color:var(--muted); text-decoration:none; border:none; background:none; cursor:pointer; transition:color .15s; }
        .ni.on, .ni:hover { color:var(--ind-lt); }
    </style>
</head>
<body>

<header class="hdr">
    <div class="hdr-brand">
        <div class="hdr-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        </div>
        <div>
            <div class="hdr-title">Health Check</div>
            <div class="hdr-sub">Runs on GCP · Gemini 2.5 Flash · All dashboards update live</div>
        </div>
    </div>
    <div class="conn-pill">
        <div class="cdot" id="cdot"></div>
        <span id="ctext">Connecting...</span>
    </div>
</header>

<div class="body">

    <!-- SELECT RESIDENT -->
    <div class="card">
        <div class="card-title"><span>👤</span> Select Resident</div>
        <div class="res-list" id="res-list">
            <div style="color:var(--muted);font-size:0.85rem;padding:12px;text-align:center">Loading from GCP...</div>
        </div>
    </div>

    <!-- TRIGGER -->
    <div class="card">
        <div class="card-title"><span>🤖</span> Launch AI Health Check</div>
        <div class="trigger-wrap">
            <button class="trigger-btn" id="tbtn" onclick="runCheck()">
                <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                <span id="blabel">Run Check</span>
            </button>
            <div class="trigger-hint" id="thint">
                Sends a request to GCP Cloud Run.<br>The AI agents execute on the server.<br>The main dashboard updates live.
            </div>
        </div>
    </div>

    <!-- LIVE LOG — hidden until running -->
    <div class="card" id="log-card" style="display:none">
        <div class="card-title">
            <span>📡</span> Live Agent Stream
            <span id="agent-stat" style="margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--muted)"></span>
        </div>
        <div class="prog-bar-wrap"><div class="prog-bar" id="pbar"></div></div>
        <div class="log-box" id="log-box"></div>
    </div>

    <!-- RESULT -->
    <div id="result-wrap"></div>

</div>

<nav class="bnav">
    <a href="family-app.html" class="ni">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Alerts
    </a>
    <a href="javascript:void(0)" class="ni on">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        Health Check
    </a>
    <a href="ehr-gateway.html" class="ni">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 9h3M15 15h3"/></svg>
        EHR
    </a>
</nav>

<script>
/* ─────────────────────────────────────────────────────────────
   This page is a THIN CLIENT.
   - All AI computation happens on GCP Cloud Run.
   - This file contains ZERO agent logic.
   - "Run Check" → POST to GCP → GCP runs agents → GCP broadcasts
     events to ALL connected clients (this page + the main dashboard).
───────────────────────────────────────────────────────────── */

const GCP = 'https://wellnest-a2a-28869653773.us-central1.run.app';
let selectedId = null;
let running = false;

// ── Connection check ──────────────────────────────────────────
async function checkConn() {
    const dot = document.getElementById('cdot');
    const txt = document.getElementById('ctext');
    try {
        const r = await fetch(`${GCP}/api/alerts`, { signal: AbortSignal.timeout(6000) });
        if (r.ok) { dot.classList.add('live'); txt.textContent = 'GCP Live'; }
        else { throw new Error(); }
    } catch {
        dot.classList.remove('live');
        txt.textContent = 'Offline';
    }
}

// ── Load residents from GCP backend ──────────────────────────
async function loadResidents() {
    try {
        const r = await fetch(`${GCP}/api/residents`, { signal: AbortSignal.timeout(10000) });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const residents = await r.json();

        const el = document.getElementById('res-list');
        el.innerHTML = '';
        residents.forEach((res, i) => {
            const row = document.createElement('div');
            row.className = 'res-row' + (i === 0 ? ' sel' : '');
            if (i === 0) selectedId = res.id;
            row.innerHTML = `
                <div class="res-row-l">
                    <div class="rav">${res.name.charAt(0)}</div>
                    <div>
                        <div class="rname">${res.name}</div>
                        <div class="rmeta">Age ${res.age} · ${(res.conditions || []).slice(0, 2).join(', ')}</div>
                    </div>
                </div>
                <svg class="rcheck" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
            `;
            row.onclick = () => {
                document.querySelectorAll('.res-row').forEach(r => r.classList.remove('sel'));
                row.classList.add('sel');
                selectedId = res.id;
            };
            el.appendChild(row);
        });
    } catch (e) {
        document.getElementById('res-list').innerHTML =
            `<div style="color:#ef4444;font-size:0.82rem;padding:8px">
                Failed to reach GCP: ${e.message}<br>
                <small style="color:var(--muted)">Check internet connection. Backend: ${GCP}</small>
             </div>`;
    }
}

// ── Log a line to the stream box ─────────────────────────────
function addLog(agent, msg) {
    const box = document.getElementById('log-box');
    const now = new Date().toLocaleTimeString('en-GB');
    const key = (agent || 'SYSTEM').toUpperCase().replace(/ /g, '_');
    const div = document.createElement('div');
    div.className = 'll';
    div.innerHTML = `<span class="lt">${now}</span><span class="la ${key}">${key}</span><span class="lm">${msg}</span>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

// ── Main health check flow ────────────────────────────────────
async function runCheck() {
    if (!selectedId || running) return;
    running = true;

    // UI setup
    const btn    = document.getElementById('tbtn');
    const lbl    = document.getElementById('blabel');
    const hint   = document.getElementById('thint');
    const logCard = document.getElementById('log-card');
    const logBox  = document.getElementById('log-box');
    const pbar   = document.getElementById('pbar');
    const result = document.getElementById('result-wrap');
    const stat   = document.getElementById('agent-stat');

    btn.classList.add('running');
    btn.disabled = true;
    lbl.textContent = 'Running...';
    hint.textContent = 'GCP agents are executing. The main dashboard is updating live.';
    logCard.style.display = 'flex';
    logCard.style.flexDirection = 'column';
    logBox.innerHTML = '';
    result.innerHTML = '';
    pbar.style.width = '5%';
    stat.textContent = '';

    const agentOrder = ['SENSORY_GUARDIAN', 'MEDICAL_COMPLIANCE', 'COGNITIVE_COMPANION', 'CARE_COORDINATOR'];
    const agentsSeen = new Set();

    // ── STEP 1: POST /check/trigger ──────────────────────────
    // This tells GCP to start the AI agents in a background thread.
    // The response comes back immediately (fire-and-forget style).
    // All GCP-connected clients (incl. the main dashboard at the GCP URL)
    // are subscribed to /check/broadcast and will receive events live.
    addLog('SYSTEM', `Sending trigger to GCP for resident: ${selectedId}`);
    addLog('SYSTEM', `Endpoint: POST ${GCP}/api/residents/${selectedId}/check/trigger`);

    try {
        const trigRes = await fetch(
            `${GCP}/api/residents/${selectedId}/check/trigger`,
            { method: 'POST', signal: AbortSignal.timeout(12000) }
        );

        if (!trigRes.ok) {
            throw new Error(`Trigger endpoint returned HTTP ${trigRes.status}`);
        }

        const trigData = await trigRes.json();

        if (trigData.status === 'already_running') {
            addLog('SYSTEM', 'Check already running on GCP. Subscribing to the live feed...');
        } else {
            addLog('ORCHESTRATOR', 'Health check triggered on GCP. Agents starting...');
            addLog('SYSTEM', 'The main dashboard (wellnest-a2a...run.app) will update automatically.');
        }

    } catch (e) {
        // /trigger endpoint might not exist yet (pre-deployment) — fall back to /check POST
        addLog('SYSTEM', `Trigger endpoint unavailable (${e.message}). Trying direct POST...`);

        try {
            addLog('SYSTEM', `POST ${GCP}/api/residents/${selectedId}/check`);
            pbar.style.width = '20%';
            const checkRes = await fetch(
                `${GCP}/api/residents/${selectedId}/check`,
                { method: 'POST', signal: AbortSignal.timeout(180000) }
            );
            if (!checkRes.ok) throw new Error('HTTP ' + checkRes.status);
            const checkData = await checkRes.json();
            addLog('ORCHESTRATOR', 'Health check completed (synchronous mode).');
            pbar.style.width = '90%';
        } catch (e2) {
            addLog('SYSTEM', `ERROR: ${e2.message}`);
            result.innerHTML = `
                <div class="result-card crit">
                    <div class="rt">❌ Could Not Reach GCP</div>
                    <div class="rm">
                        Failed to connect to ${GCP}<br><br>
                        Error: ${e2.message}<br><br>
                        Make sure you have internet access and the Cloud Run service is running.
                    </div>
                </div>`;
            resetBtn();
            return;
        }
    }

    // ── STEP 2: Subscribe to /check/broadcast ────────────────
    // This is a persistent SSE channel. GCP pushes events to this page
    // AND to the main dashboard simultaneously — both see the same stream.
    addLog('SYSTEM', `Subscribing to broadcast channel...`);
    pbar.style.width = '10%';

    await new Promise(resolve => {
        let resolved = false;

        function done() {
            if (resolved) return;
            resolved = true;
            resolve();
        }

        const src = new EventSource(`${GCP}/api/residents/${selectedId}/check/broadcast`);

        src.onmessage = function(e) {
            let ev;
            try { ev = JSON.parse(e.data); } catch { return; }

            const evType = ev.event_type || '';
            const agent  = (ev.agent || 'SYSTEM').toUpperCase().replace(/ /g, '_');
            const msg    = ev.message || '';

            // Ignore the initial connection handshake noise
            if (evType === 'BROADCAST_CONNECTED') {
                addLog('SYSTEM', 'Broadcast channel connected. Waiting for agent events...');
                return;
            }

            addLog(agent, msg);

            // Track progress
            if (agentOrder.includes(agent)) {
                agentsSeen.add(agent);
                const n = agentOrder.filter(a => agentsSeen.has(a)).length;
                pbar.style.width = `${Math.min(15 + n * 18, 88)}%`;
                stat.textContent = `${agentsSeen.size}/4 agents`;
            }

            // COMPLETE sentinel — check is done
            if (evType === 'COMPLETE') {
                pbar.style.width = '100%';
                src.close();
                done();
            }
        };

        src.onerror = function() {
            src.close();
            addLog('SYSTEM', 'Broadcast stream ended. Fetching final result from Firestore...');
            done();
        };

        // Hard timeout: 3 minutes
        setTimeout(() => {
            src.close();
            done();
        }, 180000);
    });

    // ── STEP 3: Fetch final result from Firestore ─────────────
    // /api/alerts is backed by Firestore — always accurate regardless
    // of which Cloud Run instance handled the request.
    pbar.style.width = '100%';
    addLog('SYSTEM', 'Fetching result from Firestore...');

    await new Promise(r => setTimeout(r, 1500)); // brief pause for Firestore write to propagate

    try {
        const ar = await fetch(`${GCP}/api/alerts`, { signal: AbortSignal.timeout(10000) });
        if (!ar.ok) throw new Error('HTTP ' + ar.status);
        const allAlerts = await ar.json();

        const latest = (allAlerts || [])
            .filter(a => a.resident_id === selectedId)
            .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))[0];

        if (latest) {
            const clsMap = { CRITICAL: 'crit', WARNING: 'warn', ADVISORY: 'warn', INFO: 'safe' };
            const iconMap = { CRITICAL: '🔴', WARNING: '🟡', ADVISORY: '🔵', INFO: '🟢' };
            const cls  = clsMap[latest.severity] || 'safe';
            const icon = iconMap[latest.severity] || '🟢';
            const acts = Array.isArray(latest.actions) ? latest.actions : [];

            result.innerHTML = `
                <div class="result-card ${cls}">
                    <div class="rt">${icon} Consensus: ${latest.severity}</div>
                    <div class="rm">${latest.message || 'Health check complete.'}</div>
                    ${acts.length ? `<div class="acts">${acts.map(a => `<span class="act">${a.trim()}</span>`).join('')}</div>` : ''}
                </div>
                <div class="note">
                    ✅ Result from Firestore · Family App &amp; EHR updated automatically
                </div>
            `;
        } else {
            result.innerHTML = `
                <div class="result-card safe">
                    <div class="rt">✅ All Clear</div>
                    <div class="rm">No clinical anomalies detected for this resident.</div>
                </div>`;
        }
    } catch (e) {
        result.innerHTML = `
            <div class="result-card safe">
                <div class="rt">✅ Check Complete</div>
                <div class="rm">Agents finished on GCP. Open the Family App or EHR to see results.</div>
            </div>`;
    }

    hint.textContent = 'Done. Family App and EHR Gateway updated automatically via Firestore.';
    resetBtn();
}

function resetBtn() {
    const btn = document.getElementById('tbtn');
    btn.classList.remove('running');
    btn.disabled = false;
    document.getElementById('blabel').textContent = 'Run Check';
    running = false;
}

// ── Init ──────────────────────────────────────────────────────
checkConn();
loadResidents();
setInterval(checkConn, 15000);
</script>
</body>
</html>
