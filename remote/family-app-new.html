<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WellNest | Family Connect (Push Notifications)</title>
    <meta name="description" content="WellNest Family App — real-time AI-powered health alerts with browser push notifications from the care facility.">
    <meta name="theme-color" content="#1e5945">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WellNest">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --api: 'https://wellnest-a2a-28869653773.us-central1.run.app';
            --teal: #1e5945;
            --teal-lt: #4f8066;
            --sage: #86aa8d;
            --sage-lt: #e8f0e9;
            --bg: #f4f7f3;
            --surface: #ffffff;
            --border: #d7e4d9;
            --text: #17382c;
            --muted: #687a70;
            --green: #10b981;
            --amber: #f59e0b;
            --red: #ef4444;
            --blue: #3b82f6;
            --shadow: 0 2px 16px rgba(30,89,69,.11);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

        /* PRELOADER */
        body.no-scroll { overflow: hidden; }
        .preloader {
            --forest-700: #25664e;
            --sage-500: #78a984;
            --forest-900: #103d30;
            --muted: #698078;
        }
        .preloader {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 50% 40%, rgba(174, 208, 180, .28), transparent 31%),
                linear-gradient(145deg, #f8fcf9 0%, #e9f3eb 100%);
            transition: opacity .55s ease, visibility .55s ease;
        }
        .preloader.done { opacity: 0; visibility: hidden; pointer-events: none; }
        .loader-inner { width: min(82vw, 280px); text-align: center; }
        .loader-mark { width: 132px; height: 132px; margin: 0 auto 22px; position: relative; display: grid; place-items: center; }
        .loader-mark::before, .loader-mark::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(37, 102, 78, .18);
        }
        .loader-mark::before { inset: 0; border-top-color: var(--forest-700); animation: loaderSpin 2.1s linear infinite; }
        .loader-mark::after { inset: 9px; border-right-color: var(--sage-500); animation: loaderSpin 1.55s linear infinite reverse; }
        .loader-logo { width: 92px; height: 92px; object-fit: contain; filter: drop-shadow(0 10px 17px rgba(15, 61, 47, .13)); }
        .loader-title { font-family: 'Manrope', sans-serif; font-weight: 800; letter-spacing: .16em; color: var(--forest-900); font-size: .95rem; }
        .loader-copy { color: var(--muted); font-size: .78rem; margin-top: 7px; }
        .loader-track { height: 3px; margin-top: 20px; overflow: hidden; border-radius: 99px; background: rgba(37, 102, 78, .10); }
        .loader-bar { width: 46%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--sage-500), var(--forest-700)); animation: loaderProgress 1.25s ease-in-out infinite; }
        @keyframes loaderSpin { to { transform: rotate(360deg); } }
        @keyframes loaderProgress { 0% { transform: translateX(-115%); } 100% { transform: translateX(250%); } }

        /* ── HEADER ── */
        .hdr {
            background: var(--teal);
            color: white;
            padding: 14px 16px 12px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 50;
            box-shadow: 0 2px 12px rgba(30,89,69,.3);
        }
        .hdr-brand { display: flex; align-items: center; gap: 10px; }
        .hdr-icon { width: 42px; height: 42px; background: white; border-radius: 11px; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
        .hdr-icon img { width: 40px; height: 40px; max-width: 100%; object-fit: contain; transform: none; filter: drop-shadow(0 5px 10px rgba(0,0,0,.12)); }
        .hdr-title { font-family: 'Outfit', sans-serif; font-size: 1.05rem; font-weight: 700; }
        .hdr-sub { font-size: 0.65rem; opacity: .75; }
        .hdr-right { display: flex; align-items: center; gap: 8px; }
        .conn-pill {
            display: flex; align-items: center; gap: 5px;
            background: rgba(255,255,255,.15);
            border: 1px solid rgba(255,255,255,.3);
            border-radius: 20px; padding: 5px 11px;
            font-size: 0.72rem; font-weight: 600;
        }
        .notif-pill {
            display: flex; align-items: center; gap: 5px;
            background: rgba(255,255,255,.2);
            border: 1px solid rgba(255,255,255,.35);
            border-radius: 20px; padding: 5px 11px;
            font-size: 0.72rem; font-weight: 600;
            cursor: pointer; transition: all .2s;
        }
        .notif-pill:hover { background: rgba(255,255,255,.3); }
        .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.4); }
        .conn-dot.live { background: #34d399; animation: blink 2s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

        /* ── RESIDENT STRIP ── */
        .res-strip { background: var(--teal); padding: 0 16px 14px; display: flex; gap: 8px; overflow-x: auto; }
        .res-chip {
            flex-shrink: 0;
            padding: 7px 16px; border-radius: 20px;
            border: 2px solid rgba(255,255,255,.35);
            background: rgba(255,255,255,.15);
            color: white; font-size: 0.8rem; font-weight: 600;
            cursor: pointer; transition: all .2s; white-space: nowrap;
        }
        .res-chip.active { background: white; color: var(--teal); border-color: white; }

        /* ── SCROLL BODY ── */
        .body { flex: 1; overflow-y: auto; padding: 14px 14px 84px; display: flex; flex-direction: column; gap: 12px; }

        /* ── STATUS BANNER ── */
        .status-banner {
            border-radius: 14px; padding: 14px 16px;
            display: flex; align-items: center; gap: 12px;
            border: 1px solid;
        }
        .status-banner.safe { background: #d1fae5; border-color: #a7f3d0; }
        .status-banner.advisory { background: #dbeafe; border-color: #bfdbfe; }
        .status-banner.warning { background: #fef3c7; border-color: #fde68a; }
        .status-banner.critical { background: #fee2e2; border-color: #fecaca; }
        .status-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .safe .status-icon { background: #a7f3d0; }
        .advisory .status-icon { background: #bfdbfe; }
        .warning .status-icon { background: #fde68a; }
        .critical .status-icon { background: #fecaca; }
        .status-text h3 { font-size: 0.82rem; font-weight: 600; color: var(--muted); }
        .status-text p { font-size: 0.95rem; font-weight: 700; }
        .safe .status-text p { color: #065f46; }
        .advisory .status-text p { color: #1e40af; }
        .warning .status-text p { color: #92400e; }
        .critical .status-text p { color: #991b1b; }

        /* ── VITALS GRID ── */
        .vitals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        @media(min-width:440px) { .vitals-grid { grid-template-columns: repeat(4,1fr); } }
        .vcard { background: var(--surface); border-radius: 12px; padding: 12px 8px; text-align: center; border: 1px solid var(--border); box-shadow: var(--shadow); }
        .vcard.flag { border-color: #fecaca; background: #fff5f5; }
        .ve { font-size: 1.3rem; }
        .vv { font-family: 'Outfit', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--teal); }
        .vcard.flag .vv { color: var(--red); }
        .vu { font-size: 0.62rem; color: var(--muted); }
        .vl { font-size: 0.68rem; color: var(--muted); margin-top: 3px; }

        /* ── SECTION LABEL ── */
        .sec-label { display: flex; align-items: center; justify-content: space-between; }
        .sec-label h3 { font-family: 'Outfit', sans-serif; font-size: 0.95rem; font-weight: 700; }
        .badge { background: var(--red); color: white; font-size: 0.65rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; }

        /* ── ALERT CARDS ── */
        .alert-card { background: var(--surface); border-radius: 12px; padding: 14px; border: 1px solid var(--border); border-left: 4px solid var(--amber); box-shadow: var(--shadow); animation: rise .35s ease; }
        @keyframes rise { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
        .alert-card.CRITICAL { border-left-color: var(--red); background: #fff5f5; }
        .alert-card.WARNING  { border-left-color: var(--amber); background: #fffbeb; }
        .alert-card.ADVISORY { border-left-color: var(--blue); background: #eff6ff; }
        .alert-card.INFO     { border-left-color: var(--green); background: #f0fdf4; }
        .atop { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
        .asev { font-size: 0.65rem; font-weight: 700; padding: 2px 9px; border-radius: 10px; }
        .CRITICAL .asev { background: #fee2e2; color: var(--red); }
        .WARNING  .asev { background: #fef3c7; color: #92400e; }
        .ADVISORY .asev { background: #dbeafe; color: #1e40af; }
        .INFO     .asev { background: #d1fae5; color: #065f46; }
        .atime { font-size: 0.68rem; color: var(--muted); }
        .amsg { font-size: 0.88rem; line-height: 1.55; color: var(--text); margin-bottom: 8px; }
        .atags { display: flex; flex-wrap: wrap; gap: 5px; }
        .atag { font-size: 0.68rem; padding: 3px 8px; border-radius: 10px; background: #f1f5f9; color: var(--muted); font-weight: 500; border: 1px solid #e2e8f0; }

        /* ── EMPTY ── */
        .empty { text-align: center; padding: 32px 16px; background: var(--surface); border-radius: 14px; border: 2px dashed var(--border); color: var(--muted); }
        .empty .eico { font-size: 2.2rem; margin-bottom: 10px; }

        /* ── EMERGENCY ── */
        .emg-btns { display: flex; flex-direction: column; gap: 9px; }
        .emg-btns h3 { font-family: 'Outfit', sans-serif; font-size: 0.95rem; font-weight: 700; }
        .emg-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 15px; border-radius: 12px; border: none;
            font-size: 0.95rem; font-weight: 700; cursor: pointer;
            transition: all .2s; width: 100%;
        }
        .emg-btn:active { transform: scale(.97); }
        .btn-call { background: linear-gradient(135deg,#0ea5e9,#0284c7); color: white; }
        .btn-911  { background: linear-gradient(135deg,#ef4444,#dc2626); color: white; }

        /* ── BOTTOM NAV ── */
        .bnav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e2e8f0; display: flex; z-index: 50; padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -4px 16px rgba(0,0,0,.07); }
        .ni { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 6px 12px; gap: 4px; font-size: 0.62rem; font-weight: 600; color: var(--muted); text-decoration: none; border: none; background: none; cursor: pointer; transition: color .15s; }
        .ni.on, .ni:hover { color: var(--teal); }

        /* ── GUARDIAN PROFILE ── */
        .profile-wrap { display: flex; flex-direction: column; gap: 12px; }
        .profile-hero { position: relative; overflow: hidden; background: linear-gradient(145deg,var(--teal),#34705a); color: white; border-radius: 18px; padding: 20px; text-align: center; box-shadow: var(--shadow); }
        .profile-hero::after { content:''; position:absolute; width:150px; height:150px; border:1px solid rgba(255,255,255,.14); border-radius:50%; right:-60px; top:-75px; }
        .profile-avatar { position: relative; z-index: 1; width: 68px; height: 68px; margin: 0 auto 10px; border-radius: 22px; display:flex; align-items:center; justify-content:center; background:var(--sage-lt); color:var(--teal); font-family:'Outfit',sans-serif; font-size:1.35rem; font-weight:800; border:3px solid rgba(255,255,255,.3); }
        .profile-hero h2 { font-family:'Outfit',sans-serif; font-size:1.15rem; }
        .profile-hero p { margin-top:4px; font-size:.76rem; color:#d6e9dc; }
        .profile-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; box-shadow:var(--shadow); }
        .profile-card h3 { font-family:'Outfit',sans-serif; font-size:.95rem; margin-bottom:13px; }
        .field-grid { display:grid; grid-template-columns:1fr; gap:11px; }
        .field label { display:block; margin-bottom:5px; font-size:.7rem; font-weight:700; color:var(--muted); }
        .field input,.field select { width:100%; min-height:44px; padding:0 12px; border:1px solid var(--border); border-radius:11px; color:var(--text); background:#fbfdfb; outline:none; }
        .field input:focus,.field select:focus { border-color:var(--sage); box-shadow:0 0 0 3px rgba(134,170,141,.18); }
        .profile-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
        .profile-btn { min-height:45px; padding:0 13px; border:1px solid var(--border); border-radius:11px; font-weight:700; cursor:pointer; color:var(--teal); background:white; }
        .profile-btn.primary { color:white; border-color:var(--teal); background:var(--teal); }
        .profile-btn.danger { color:#b83232; }
        .local-note { display:flex; gap:8px; align-items:flex-start; padding:11px; border-radius:11px; background:var(--sage-lt); color:#4f6658; font-size:.7rem; line-height:1.5; }
        .toast { position:fixed; z-index:100; left:50%; bottom:82px; max-width:calc(100% - 30px); transform:translate(-50%,18px); opacity:0; pointer-events:none; padding:11px 15px; border-radius:12px; color:white; background:#17382c; box-shadow:0 8px 26px rgba(0,0,0,.22); font-size:.75rem; font-weight:700; transition:.2s; }
        .toast.show { transform:translate(-50%,0); opacity:1; }
    </style>
</head>
<body class="no-scroll">

<div class="preloader" id="preloader" role="status" aria-live="polite">
    <div class="loader-inner">
        <div class="loader-mark"><img class="loader-logo" src="https://i.ibb.co/DHkjd9VB/Well-Nest-Logo.png" alt=""></div>
        <div class="loader-title">WELLNEST</div>
        <div class="loader-copy">Preparing Family Connect (Push Enabled)</div>
        <div class="loader-track" aria-hidden="true"><div class="loader-bar"></div></div>
    </div>
</div>

<!-- HEADER -->
<header class="hdr">
    <div class="hdr-brand">
        <div class="hdr-icon">
            <img src="https://i.ibb.co/DHkjd9VB/Well-Nest-Logo.png" alt="WellNest logo">
        </div>
        <div>
            <div class="hdr-title">Family Connect</div>
            <div class="hdr-sub">Push Alert Edition</div>
        </div>
    </div>
    <div class="hdr-right">
        <div class="notif-pill" id="notif-pill" onclick="requestPushPermission()">
            <span id="notif-text">Enable Push 🔔</span>
        </div>
        <div class="conn-pill">
            <div class="conn-dot" id="cdot"></div>
            <span id="ctext">Connecting...</span>
        </div>
    </div>
</header>

<!-- RESIDENT STRIP -->
<div class="res-strip" id="res-strip">
    <div class="res-chip active" data-id="sriyani_001">Loading...</div>
</div>

<!-- SCROLLABLE BODY -->
<div class="body" id="body-content">
    <div class="empty"><div class="eico">⏳</div><p>Loading resident data...</p></div>
</div>

<!-- BOTTOM NAV -->
<nav class="bnav">
    <button type="button" class="ni on" id="nav-alerts" onclick="showAlerts()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Alerts
    </button>
    <button type="button" class="ni" id="nav-profile" onclick="showGuardianProfile()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        Profile
    </button>
</nav>

<div class="toast" id="toast" role="status"></div>

<script>
/* ── CONFIG ── */
const GCP = (window.location.protocol.startsWith('http')) ? window.location.origin : 'https://wellnest-a2a-28869653773.us-central1.run.app';
let activeResident = 'sriyani_001';
let residents = [];
let profile = null;
let vitels = null;
let alerts = [];
let currentView = 'alerts';
let guardianProfile = JSON.parse(localStorage.getItem('wellnest_guardian_profile') || 'null');
if (guardianProfile?.residentId) activeResident = guardianProfile.residentId;

/* ── SERVICE WORKER REGISTRATION ── */
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').then(reg => {
        console.log('Family App SW registered:', reg.scope);
    }).catch(err => console.warn('Family App SW reg error:', err));
}

/* ── PUSH NOTIFICATION ENGINE ── */
let notifiedAlerts = new Set();

async function sendPushNotification(title, options = {}) {
    if (!("Notification" in window) || Notification.permission !== "granted") return;

    const notifOptions = {
        icon: "https://i.ibb.co/DHkjd9VB/Well-Nest-Logo.png",
        badge: "https://i.ibb.co/DHkjd9VB/Well-Nest-Logo.png",
        vibrate: [200, 100, 200, 100, 200],
        ...options
    };

    // Android Mobile Chrome requires ServiceWorkerRegistration.showNotification() for popups
    if ('serviceWorker' in navigator) {
        try {
            const reg = await navigator.serviceWorker.ready;
            if (reg && reg.showNotification) {
                await reg.showNotification(title, notifOptions);
                return;
            }
        } catch (e) {
            console.warn("ServiceWorker showNotification failed, using fallback:", e);
        }
    }

    try {
        new Notification(title, notifOptions);
    } catch (e) {
        console.error("Native Notification error:", e);
    }
}

function updateNotifPill() {
    const pill = document.getElementById('notif-pill');
    const txt = document.getElementById('notif-text');
    if (!pill || !txt) return;
    if (!("Notification" in window)) {
        txt.textContent = "Push Unsupported";
        return;
    }
    if (Notification.permission === "granted") {
        pill.style.background = "rgba(16, 185, 129, 0.35)";
        txt.textContent = "Push Active 🔔";
    } else if (Notification.permission === "denied") {
        pill.style.background = "rgba(239, 68, 68, 0.35)";
        txt.textContent = "Push Blocked";
    } else {
        pill.style.background = "rgba(255, 255, 255, 0.2)";
        txt.textContent = "Enable Push 🔔";
    }
}

function requestPushPermission() {
    if (!("Notification" in window)) {
        showToast("Push notifications are not supported by this browser.");
        return;
    }
    if (Notification.permission === "granted") {
        showToast("Push notifications are already active!");
        sendPushNotification("WellNest Family Connect", {
            body: "Push notifications active for live health check alerts."
        });
        return;
    }
    Notification.requestPermission().then(permission => {
        updateNotifPill();
        if (permission === "granted") {
            showToast("Push notifications enabled!");
            sendPushNotification("WellNest Family Connect", {
                body: "Push notifications enabled for live health check alerts."
            });
        } else if (permission === "denied") {
            showToast("Notification permission blocked in browser settings.");
        }
    });
}

function checkAndTriggerPush(alertsList) {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    alertsList.forEach(a => {
        const alertKey = (a.timestamp || '') + '_' + (a.severity || '') + '_' + (a.message || '');
        if (!notifiedAlerts.has(alertKey)) {
            notifiedAlerts.add(alertKey);
            const title = `WellNest ${a.severity || 'Clinical'} Alert`;
            const body = `${profile?.name || 'Resident'}: ${a.message || 'New health update'}`;
            sendPushNotification(title, {
                body: body,
                tag: alertKey,
                requireInteraction: a.severity === 'CRITICAL' || a.severity === 'WARNING'
            });
        }
    });
}

let eventSource = null;
function subscribeToSSE(residentId) {
    if (!residentId) return;
    if (eventSource) {
        eventSource.close();
        eventSource = null;
    }
    const sseUrl = `${GCP}/api/residents/${residentId}/check/broadcast`;
    eventSource = new EventSource(sseUrl);

    eventSource.onopen = () => {
        const dot = document.getElementById('cdot');
        const txt = document.getElementById('ctext');
        if (dot) dot.classList.add('live');
        if (txt) txt.textContent = 'Live';
    };

    eventSource.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);
            const txt = document.getElementById('ctext');
            if (data.event_type === 'ALERT' || data.event_type === 'COMPLETE') {
                loadAll();
                if (txt) txt.textContent = 'Live';
                if (data.payload && Notification.permission === "granted") {
                    const p = data.payload;
                    const key = p.timestamp || Date.now();
                    if (!notifiedAlerts.has(key)) {
                        notifiedAlerts.add(key);
                        sendPushNotification("WellNest Live Alert", {
                            body: p.message || "Health check completed.",
                            tag: String(key)
                        });
                    }
                }
            } else if (data.event_type && data.event_type !== 'BROADCAST_CONNECTED') {
                if (txt) txt.textContent = 'AI Check Running...';
            }
        } catch (e) {}
    };

    eventSource.onerror = () => {
        const txt = document.getElementById('ctext');
        if (txt) txt.textContent = 'Offline';
    };
}

/* ── CONNECTION CHECK ── */
async function checkConn() {
    const dot = document.getElementById('cdot');
    const txt = document.getElementById('ctext');
    try {
        const r = await fetch(`${GCP}/api/alerts`, { signal: AbortSignal.timeout(5000) });
        if (r.ok) { dot.classList.add('live'); if (txt.textContent !== 'AI Check Running...') txt.textContent = 'Live'; }
        else throw 0;
    } catch { dot.classList.remove('live'); txt.textContent = 'Offline'; }
}

/* ── LOAD RESIDENTS ── */
async function loadResidents() {
    try {
        const r = await fetch(`${GCP}/api/residents`);
        residents = await r.json();
        const strip = document.getElementById('res-strip');
        strip.innerHTML = '';
        const visibleResidents = guardianProfile?.residentId
            ? residents.filter(res => res.id === guardianProfile.residentId)
            : residents;
        visibleResidents.forEach((res, i) => {
            const chip = document.createElement('div');
            chip.className = 'res-chip' + (res.id === activeResident ? ' active' : '');
            chip.dataset.id = res.id;
            chip.textContent = res.name.split(' ')[0];
            chip.onclick = () => {
                document.querySelectorAll('.res-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                activeResident = res.id;
                loadAll();
                subscribeToSSE(activeResident);
            };
            strip.appendChild(chip);
        });
        subscribeToSSE(activeResident);
    } catch(e) {}
}

/* ── LOAD ALL DATA ── */
async function loadAll() {
    try {
        const [pd, al] = await Promise.all([
            fetch(`${GCP}/api/residents/${activeResident}`).then(r => r.json()),
            fetch(`${GCP}/api/alerts`).then(r => r.json())
        ]);
        profile = pd.profile;
        vitels = pd.vitals?.telemetry || {};
        /* Filter alerts for this resident, sorted newest first */
        alerts = (al || [])
            .filter(a => a.resident_id === activeResident)
            .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        checkAndTriggerPush(alerts);
        if (currentView === 'alerts') render();
    } catch(e) {
        document.getElementById('body-content').innerHTML = `<div class="empty"><div class="eico">⚠️</div><p>Unable to reach the GCP backend. Check your internet connection.</p></div>`;
    }
}

/* ── RENDER ── */
function render() {
    const top = alerts[0];
    const sev = top?.severity || 'SAFE';

    const sevMap = {
        CRITICAL: { cls:'critical', icon:'🔴', text:'CRITICAL — Immediate attention required' },
        WARNING:  { cls:'warning',  icon:'🟡', text:'Warning — Monitor the resident closely' },
        ADVISORY: { cls:'advisory', icon:'🔵', text:'Advisory — Follow care instructions' },
        INFO:     { cls:'safe',     icon:'🟢', text:'All readings normal — Resident is safe' },
        SAFE:     { cls:'safe',     icon:'🟢', text:'No active alerts — Resident is safe' },
    };
    const s = sevMap[sev] || sevMap.SAFE;

    /* Anomaly flags */
    const bpFlag = (vitels.bp_systolic >= 140) || (vitels.bp_diastolic >= 90);
    const baseline = profile?.baseline_vitals?.gait_speed_ms || 0.85;
    const gaitFlag = baseline > 0 && ((baseline - (vitels.gait_speed_ms || baseline)) / baseline) >= 0.15;

    /* Alerts HTML */
    const alertsHTML = alerts.length === 0
        ? `<div class="empty"><div class="eico">✅</div><p>No active alerts.<br>Your loved one is doing well.</p></div>`
        : alerts.map(a => {
            const acts = Array.isArray(a.actions) ? a.actions : [];
            return `<div class="alert-card ${a.severity}">
                <div class="atop">
                    <span class="asev">${a.severity}</span>
                    <span class="atime">${new Date(a.timestamp).toLocaleString()}</span>
                </div>
                <div class="amsg">${a.message || ''}</div>
                ${acts.length ? `<div class="atags">${acts.map(t => `<span class="atag">${t.trim()}</span>`).join('')}</div>` : ''}
            </div>`;
        }).join('');

    document.getElementById('body-content').innerHTML = `
        <!-- STATUS -->
        <div class="status-banner ${s.cls}">
            <div class="status-icon"><span style="font-size:1.4rem">${s.icon}</span></div>
            <div class="status-text">
                <h3>${profile?.name || 'Resident'}</h3>
                <p>${s.text}</p>
            </div>
        </div>

        <!-- VITALS -->
        <div class="vitals-grid">
            <div class="vcard"><div class="ve">❤️</div><div class="vv">${vitels.heart_rate_bpm || '--'}</div><div class="vu">bpm</div><div class="vl">Heart Rate</div></div>
            <div class="vcard ${bpFlag ? 'flag' : ''}"><div class="ve">🩺</div><div class="vv">${vitels.bp_systolic || '--'}/${vitels.bp_diastolic || '--'}</div><div class="vu">mmHg</div><div class="vl">Blood Pressure</div></div>
            <div class="vcard ${gaitFlag ? 'flag' : ''}"><div class="ve">🚶</div><div class="vv">${vitels.gait_speed_ms || '--'}</div><div class="vu">m/s</div><div class="vl">Gait Speed</div></div>
            <div class="vcard"><div class="ve">🌙</div><div class="vv">${vitels.sleep_duration_hrs || '--'}</div><div class="vu">hrs</div><div class="vl">Sleep</div></div>
        </div>

        <!-- ALERTS -->
        <div class="sec-label">
            <h3>Clinical Alerts</h3>
            ${alerts.length ? `<span class="badge">${alerts.length}</span>` : ''}
        </div>
        ${alertsHTML}

        <!-- EMERGENCY -->
        <div class="emg-btns">
            <h3>Emergency Actions</h3>
            <button class="emg-btn btn-call" onclick="window.location='tel:+15550001'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                Call Care Facility
            </button>
            <button class="emg-btn btn-911" onclick="window.location='tel:911'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                Dial 911 Emergency
            </button>
        </div>
    `;
}

/* ── LOCAL GUARDIAN PROFILE ── */
function setActiveNav(id) {
    document.querySelectorAll('.ni').forEach(item => item.classList.remove('on'));
    document.getElementById(id)?.classList.add('on');
}

function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.classList.remove('show'), 2400);
}

function showAlerts() {
    currentView = 'alerts';
    setActiveNav('nav-alerts');
    render();
}

function guardianInitials(name) {
    return (name || 'Guardian').trim().split(/\s+/).map(word => word[0]).slice(0,2).join('').toUpperCase();
}

function escapeValue(value) {
    return String(value || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showGuardianProfile(editing = !guardianProfile) {
    currentView = 'profile';
    setActiveNav('nav-profile');
    const saved = guardianProfile || {};
    if (!editing && guardianProfile) {
        document.getElementById('body-content').innerHTML = `
            <div class="profile-wrap">
                <section class="profile-hero">
                    <div class="profile-avatar">${guardianInitials(saved.name)}</div>
                    <h2>${escapeValue(saved.name)}</h2>
                    <p>${escapeValue(saved.relationship)} of ${escapeValue(profile?.name || 'the resident')}</p>
                </section>
                <section class="profile-card">
                    <h3>Guardian details</h3>
                    <div style="display:grid;gap:12px;font-size:.8rem">
                        <div><span style="color:var(--muted);font-size:.68rem">Selected elder</span><br><strong>${escapeValue(residents.find(res => res.id === saved.residentId)?.name || profile?.name || 'Not selected')}</strong></div>
                        <div><span style="color:var(--muted);font-size:.68rem">Phone</span><br><strong>${escapeValue(saved.phone)}</strong></div>
                        <div><span style="color:var(--muted);font-size:.68rem">Email</span><br><strong>${escapeValue(saved.email || 'Not provided')}</strong></div>
                        <div><span style="color:var(--muted);font-size:.68rem">Emergency contact</span><br><strong>${escapeValue(saved.emergencyPhone || 'Not provided')}</strong></div>
                    </div>
                    <div class="profile-actions"><button class="profile-btn" onclick="showGuardianProfile(true)">Edit profile</button><button class="profile-btn danger" onclick="deleteGuardianProfile()">Delete</button></div>
                </section>
            </div>`;
        return;
    }

    document.getElementById('body-content').innerHTML = `
        <div class="profile-wrap">
            <section class="profile-hero">
                <div class="profile-avatar">${guardianInitials(saved.name)}</div>
                <h2>${guardianProfile ? 'Edit guardian profile' : 'Create guardian profile'}</h2>
                <p>Set up your local Family Connect identity</p>
            </section>
            <form class="profile-card" id="guardian-form" onsubmit="saveGuardianProfile(event)">
                <h3>Personal details</h3>
                <div class="field-grid">
                    <div class="field"><label for="guardian-name">Full name *</label><input id="guardian-name" name="name" value="${escapeValue(saved.name)}" autocomplete="name" required placeholder="Sadeep Withana"></div>
                    <div class="field"><label for="guardian-relationship">Relationship *</label><select id="guardian-relationship" name="relationship" required><option value="">Choose relationship</option>${['Son','Daughter','Spouse','Sibling','Relative','Professional caregiver','Other'].map(item => `<option ${saved.relationship === item ? 'selected' : ''}>${item}</option>`).join('')}</select></div>
                    <div class="field"><label for="guardian-resident">Select elder *</label><select id="guardian-resident" name="residentId" required><option value="">Choose the elder you care for</option>${residents.map(res => `<option value="${escapeValue(res.id)}" ${saved.residentId === res.id ? 'selected' : ''}>${escapeValue(res.name)}</option>`).join('')}</select></div>
                    <div class="field"><label for="guardian-phone">Phone number *</label><input id="guardian-phone" name="phone" type="tel" value="${escapeValue(saved.phone)}" autocomplete="tel" required placeholder="+94 77 123 4567"></div>
                    <div class="field"><label for="guardian-email">Email address</label><input id="guardian-email" name="email" type="email" value="${escapeValue(saved.email)}" autocomplete="email" placeholder="name@example.com"></div>
                    <div class="field"><label for="guardian-emergency">Emergency contact number</label><input id="guardian-emergency" name="emergencyPhone" type="tel" value="${escapeValue(saved.emergencyPhone)}" placeholder="+94 11 234 5678"></div>
                </div>
                <div class="profile-actions" style="${guardianProfile ? '' : 'grid-template-columns:1fr'}">${guardianProfile ? '<button type="button" class="profile-btn" onclick="showGuardianProfile(false)">Cancel</button>' : ''}<button type="submit" class="profile-btn primary">Save profile</button></div>
            </form>
        </div>`;
}

async function saveGuardianProfile(event) {
    event.preventDefault();
    const data = new FormData(event.currentTarget);
    guardianProfile = Object.fromEntries(data.entries());
    activeResident = guardianProfile.residentId;
    localStorage.setItem('wellnest_guardian_profile', JSON.stringify(guardianProfile));
    await loadResidents();
    await loadAll();
    showToast('Guardian profile saved on this device');
    showGuardianProfile(false);
}

function deleteGuardianProfile() {
    if (!confirm('Delete the guardian profile from this device?')) return;
    localStorage.removeItem('wellnest_guardian_profile');
    guardianProfile = null;
    showToast('Guardian profile deleted');
    showGuardianProfile(true);
}

/* ── INIT ── */
checkConn();
updateNotifPill();
loadResidents().then(() => {
    if (guardianProfile?.residentId) loadAll();
    else showGuardianProfile(true);
});

/* Installable app support */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
}

setInterval(loadAll, 6000);
setInterval(checkConn, 12000);

const loaderStartedAt = performance.now();
window.addEventListener('load', () => {
    const delay = Math.max(0, 1150 - (performance.now() - loaderStartedAt));
    setTimeout(() => {
        document.getElementById('preloader').classList.add('done');
        document.body.classList.remove('no-scroll');
    }, delay);
});
</script>
</body>
</html>
